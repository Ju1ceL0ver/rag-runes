[server]
host = "0.0.0.0"
port = 8000

[paths]
books_dir = "books"
index_dir = "data/index"

[models]
embedder_name = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
reranker_name = "cross-encoder/ms-marco-MiniLM-L-6-v2"
segmenter_mode = "llm"
ocr_model = "glm-ocr:q8_0"
segmenter_model = "minimax-m2.5:cloud"
answer_model = "minimax-m2.5:cloud"

[endpoints]
ocr_endpoint = "http://127.0.0.1:11434/v1/chat/completions"
segmenter_endpoint = "http://127.0.0.1:11434/v1/chat/completions"
answer_endpoint = "http://127.0.0.1:11434/v1/chat/completions"

[params]
chunk_size = 1200
chunk_overlap = 180
context_chars = 750
bootstrap_on_startup = false

[auth]
ocr_api_key = ""
segmenter_api_key = ""
answer_api_key = ""
